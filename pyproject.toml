[project]
name = "vedic-ocr-cross-notation"
version = "0.1.0"
description = "Reproduction code for Cross-Notation Transfer in Vedic OCR (PACLIC 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate==1.12.0",
    "datasets==4.4.1",
    "devtrans==3.0",
    "evaluate==0.4.6",
    "hydra-core==1.3.2",
    "jiwer==4.0.0",
    "matplotlib==3.11.1",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "rapidfuzz==3.14.3",
    "sacrebleu==2.5.1",
    "tqdm==4.67.1",
    "transformers==4.57.3",
    "wandb==0.23.1",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "sanskrittransliteration @ git+https://github.com/Yuzki/SanskritTransliteration.git@d6159e26644e7155fe9d55b405dc60d519728ead"
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = [{index = "torch-cu128"}]
torchvision = [{index = "torch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}]

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
